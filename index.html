<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سینمای دیجیتال</title><style>
:root{--r:#e50914;--r2:#ff2733;--bg:#050505;--p:#111;--mut:#aaa;--gold:#ffd34d;--green:#36d477}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#350408,#070707 45%,#030303);color:#fff;font-family:Tahoma,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:#050505ee;border-bottom:1px solid #421015;backdrop-filter:blur(10px)}.nav{max-width:1200px;margin:auto;padding:14px 18px;display:flex;gap:10px;align-items:center}.logo{font-size:24px;font-weight:900}.logo b{color:var(--r)}.links{margin-right:auto;display:flex;gap:7px;flex-wrap:wrap}.links button,.coin{background:#120607;border:1px solid #401116;color:#fff;border-radius:11px;padding:9px 12px}.coin{color:var(--gold);font-weight:900}.hero,.section{max-width:1200px;margin:auto;padding:40px 18px}.hero{min-height:330px}.hero h1{font-size:clamp(36px,6vw,68px);margin:0 0 12px}.hero h1 span{color:var(--r)}.hero p{color:#bbb;line-height:2;max-width:780px}.movies{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.movie{background:linear-gradient(#171717,#0d0d0d);border:1px solid #292929;border-radius:18px;overflow:hidden}.poster{height:280px;background-size:cover;background-position:center;position:relative}.poster:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,#000)}.posterText{position:absolute;z-index:1;bottom:15px;right:15px;left:15px}.posterText h3{font-size:23px;margin:0 0 6px}.body{padding:15px}.body p{color:#aaa;line-height:1.9;min-height:60px}.tags{color:#ccc;font-size:13px}.sessions{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.session{background:#190608;color:#fff;border:1px solid #59141a;border-radius:9px;padding:8px 11px}.more,.btn{width:100%;background:var(--r);color:#fff;border:0;border-radius:11px;padding:11px 15px;font-weight:900}.btn{width:auto}.more:hover,.btn:hover{background:var(--r2)}.ticket{background:#101010;border:1px solid #292929;border-right:4px solid var(--r);padding:15px;border-radius:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:10px 0}.grow{flex:1}.code{color:var(--gold);font-weight:900}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:14px;z-index:50}.modal.open{display:flex}.box{width:min(820px,100%);max-height:92vh;overflow:auto;background:#0d0d0d;border:1px solid #67151c;border-radius:20px;padding:20px}.close{float:left;background:#292929;border:0;color:#fff;border-radius:9px;padding:7px 10px}.notice{background:#190608;border:1px solid #4b1116;padding:12px;border-radius:11px;line-height:1.9;margin:12px 0}.seats{display:grid;gap:7px;margin:18px 0}.seatrow{display:grid;grid-template-columns:35px repeat(6,1fr);gap:6px}.seat{height:38px;background:#191919;color:#fff;border:1px solid #444;border-radius:8px}.seat.sel{background:var(--r);border-color:var(--r2)}.seat.taken,.seat.reserved{background:#555;color:#999;text-decoration:line-through;cursor:not-allowed}.reserved{background:#241515!important;color:#704b4b!important}.screen{height:10px;background:linear-gradient(90deg,transparent,var(--r),transparent);box-shadow:0 0 22px var(--r);border-radius:50%;margin:15px 0}.detailPoster{width:100%;height:300px;object-fit:cover;border-radius:15px}.empty{border:1px dashed #444;padding:25px;text-align:center;color:#999;border-radius:15px}.player{position:fixed;inset:0;background:#000;z-index:100;display:none}.player.open{display:flex;align-items:center;justify-content:center}.player video{width:100%;height:100%;object-fit:contain}.playerTop{position:absolute;top:0;right:0;left:0;z-index:2;padding:18px;background:linear-gradient(#000c,transparent);display:flex;justify-content:space-between}.playerTop button{background:#ffffff18;border:1px solid #ffffff33;color:#fff;border-radius:10px;padding:8px}.hint{position:absolute;bottom:65px;right:18px;background:#000b;padding:9px 13px;border-radius:10px}.toast{position:fixed;bottom:20px;right:20px;background:#171717;border:1px solid #551219;padding:12px 16px;border-radius:11px;display:none;z-index:200}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.stat{background:#101010;border:1px solid #292929;border-radius:15px;padding:18px}.stat b{font-size:25px;color:var(--gold)}@media(max-width:700px){.nav{align-items:flex-start;flex-wrap:wrap}.links{width:100%;order:3}.hero{padding-top:28px}.poster{height:230px}.seat{height:34px;font-size:11px}}
</style></head><body><header class="top"><nav class="nav"><div class="logo">سینمای <b>دیجیتال</b></div><div class="links"><button onclick="go('movies')">فیلم‌ها</button><button onclick="go('tickets')">بلیط‌های من</button><button onclick="wallet()">کیف پول</button><button onclick="location.href='income.html'">💰 درآمد / ناشر</button></div><div class="coin">🪙 <span id="coins">1000</span> سینماکوین</div></nav></header>
<section class="hero"><h1>سینما، <span>همین‌جا.</span></h1><p>فیلم‌های منتشرشده توسط ناشران در اینجا برای همه بازدیدکنندگان نمایش داده می‌شوند. سانس، روز، صندلی و بلیت را انتخاب کن و در زمان سانس وارد پخش شو.</p><button class="btn" onclick="go('movies')">🎬 دیدن فیلم‌ها</button></section>
<section class="section" id="movies"><h2>🎬 فیلم‌های سینما</h2><div class="movies" id="movieList"></div></section><section class="section" id="tickets"><h2>🎟️ بلیط‌های من</h2><div id="ticketList"></div></section>
<div class="modal" id="modal"><div class="box" id="box"></div></div><div class="player" id="playerPage"><div class="playerTop"><b id="playingTitle"></b><button onclick="closePlayer()">✕ خروج</button></div><video id="video" controls playsinline></video><div class="hint" id="hint"></div></div><div class="toast" id="toast"></div>
<script>
const KEY='digitalCinemaData',DB='digitalCinemaFiles',PRICE=250,REWARD=100;let selected=[];
const fallback={coins:1000,revenue:0,tickets:[],taken:{},movies:[]};
function state(){try{return JSON.parse(localStorage.getItem(KEY))||structuredClone(fallback)}catch(e){return {...fallback}}}function save(s){localStorage.setItem(KEY,JSON.stringify(s));render()}function fmt(n){return Number(n||0).toLocaleString('fa-IR')}function go(id){document.getElementById(id).scrollIntoView({behavior:'smooth'})}function toast(x){let e=document.getElementById('toast');e.textContent=x;e.style.display='block';setTimeout(()=>e.style.display='none',2600)}
function db(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function getFile(id){try{let d=await db();return await new Promise((res,rej)=>{let q=d.transaction('files').objectStore('files').get(id);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}catch(e){return null}}
async function poster(m){return m.poster||'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1000&q=85'}
function movieActive(m){let now=new Date();return (m.days||[]).some(d=>{let x=new Date(d+'T23:59:59');return now.toISOString().slice(0,10)<=d})}
function nextShow(m){let now=Date.now(),arr=[];(m.days||[]).forEach(d=>(m.times||[]).forEach(t=>{let x=new Date(d+'T'+t+':00');if(x.getTime()>now)arr.push(x)}));arr.sort((a,b)=>a-b);return arr[0]||null}
async function render(){let s=state();document.getElementById('coins').textContent=fmt(s.coins);let list=document.getElementById('movieList');let movies=s.movies||[];if(!movies.length){list.innerHTML='<div class="empty">هنوز فیلمی منتشر نشده. ناشر می‌تواند از صفحه «درآمد / ناشر» فیلم خودش را منتشر کند.</div>'}else{list.innerHTML=movies.map(m=>{let n=nextShow(m);return `<article class="movie"><div class="poster" style="background-image:url('${m.poster||'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1000&q=85'}')"><div class="posterText"><h3>${esc(m.title)}</h3><small>ناشر: ${esc(m.publisher||'—')}</small></div></div><div class="body"><div class="tags">${esc(m.genre||'فیلم')} • ${fmt(m.duration||0)} دقیقه • انتشار ${esc(m.release||'—')}</div><p>${esc(m.desc||'بدون توضیحات')}</p><div class="sessions">${(m.times||[]).map(t=>`<span class="session">⏰ ${t}</span>`).join('')} ${(m.days||[]).length?`<span class="session">📅 ${m.days.length} روز</span>`:''}</div><button class="more" onclick="details('${m.id}')">مشاهده فیلم و خرید بلیت ←</button></div></article>`}).join('')}let ts=s.tickets.slice().reverse();document.getElementById('ticketList').innerHTML=ts.length?ts.map(t=>`<div class="ticket"><div class="grow"><b>${esc(t.title)}</b><div style="color:#999;margin-top:5px">${t.day} • سانس ${t.time} • صندلی ${t.seats.join('، ')}</div></div><div><div class="code">${t.code}</div><small style="color:#777">کد بلیت</small></div><button class="btn" onclick="enter('${t.code}')">🎬 ورود به فیلم</button></div>`).join(''):'<div class="empty">هنوز بلیتی نداری.</div>'}
function esc(x){return String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]))}
function open(x){document.getElementById('box').innerHTML=x;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}
function details(id){let m=state().movies.find(x=>x.id===id);if(!m)return;let days=(m.days||[]).map(d=>`<button class="session" onclick="buy('${m.id}','${d}')">📅 ${d}</button>`).join('');open(`<button class="close" onclick="closeModal()">✕</button><h2>${esc(m.title)}</h2><img class="detailPoster" src="${m.poster}"><p style="color:#bbb;line-height:2">${esc(m.desc)}</p><div class="notice"><b>ناشر:</b> ${esc(m.publisher)}<br><b>ژانر:</b> ${esc(m.genre)}<br><b>انتشار:</b> ${esc(m.release)}<br><b>مدت:</b> ${fmt(m.duration)} دقیقه</div><h3>روزهای سانس</h3><div class="sessions">${days||'<span style="color:#999">سانسی ثبت نشده</span>'}</div><p>هر صندلی: <b style="color:var(--gold)">${fmt(PRICE)} سینماکوین</b></p>`)}
function buy(id,day){let m=state().movies.find(x=>x.id===id),s=state(),tk=s.taken[id+'_'+day]||[];let h='<button class="close" onclick="closeModal()">✕</button><h2>انتخاب صندلی • '+esc(m.title)+'</h2><div class="notice">روز انتخابی: <b>'+day+'</b> • هر بلیت '+fmt(PRICE)+' سینماکوین</div><div class="screen"></div><div style="text-align:center;color:#888">صفحه نمایش</div><div class="seats">';for(let r=1;r<=11;r++){h+=`<div class="seatrow"><div style="color:#777;text-align:center">${r}</div>`;for(let c=1;c<=6;c++){let n=r+'-'+c,res=r===11,t=tk.includes(n);h+=`<button class="seat ${t?'taken':''} ${res?'reserved':''}" ${t||res?'disabled':''} onclick="toggleSeat(this,'${n}')">${c}</button>`}h+='</div>'}h+=`</div><div style="color:#999">۶۰ صندلی قابل فروش • ۶ جایگاه ردیف ۱۱ رزرو سالن</div><div id="selectedInfo" class="notice">هنوز صندلی انتخاب نشده</div><div class="sessions">${(m.times||[]).map(t=>`<button class="session" onclick="setTime('${t}')">⏰ ${t}</button>`).join('')}</div><button class="btn" onclick="confirmBuy('${id}','${day}')">پرداخت و صدور بلیت</button>`;window.buyTime=null;open(h)}function setTime(t){window.buyTime=t;let e=document.getElementById('selectedInfo');if(e)e.textContent=(selected.length?'صندلی‌ها: '+selected.join('، ')+' • ':'')+'سانس انتخابی: '+t+' • '+fmt(selected.length*PRICE)+' سینماکوین'}
function toggleSeat(el,n){if(el.disabled)return;if(el.classList.contains('sel')){el.classList.remove('sel');selected=selected.filter(x=>x!==n)}else{if(selected.length>=6)return toast('حداکثر ۶ صندلی');el.classList.add('sel');selected.push(n)}let e=document.getElementById('selectedInfo');if(e)e.textContent=selected.length?'صندلی‌ها: '+selected.join('، ')+' • هزینه: '+fmt(selected.length*PRICE)+' سینماکوین':'هنوز صندلی انتخاب نشده'}
function confirmBuy(id,day){let s=state(),m=s.movies.find(x=>x.id===id),time=window.buyTime;if(!time)return toast('اول سانس را انتخاب کن');if(!selected.length)return toast('حداقل یک صندلی');let cost=selected.length*PRICE;if(s.coins<cost)return toast('سینماکوین کافی نیست');let key=id+'_'+day,taken=s.taken[key]||[];if(selected.some(x=>taken.includes(x)))return toast('یکی از صندلی‌ها قبلاً گرفته شده');let code='CIN-'+Math.random().toString(36).slice(2,8).toUpperCase();s.coins-=cost;s.revenue=(s.revenue||0)+selected.length*REWARD;s.tickets.push({code,title:m.title,movie:id,day,time,seats:[...selected],boughtAt:Date.now(),reward:REWARD*selected.length});s.taken[key]=taken.concat(selected);selected=[];save(s);closeModal();toast('بلیت صادر شد: '+code+' • درآمد ناشر ثبت شد');go('tickets')}
async function enter(code){let s=state(),t=s.tickets.find(x=>x.code===code);if(!t)return;let m=s.movies.find(x=>x.id===t.movie);if(!m)return;let start=new Date(t.day+'T'+t.time+':00').getTime(),now=Date.now();if(now<start)return toast('سانس هنوز شروع نشده');let elapsed=Math.max(0,(now-start)/1000),duration=(m.duration||90)*60;if(elapsed>=duration)return toast('این سانس تمام شده');let blob=await getFile(m.videoId);if(!blob)return toast('فایل ویدیو در این مرورگر پیدا نشد؛ ناشر باید دوباره ویدیو را همین مرورگر منتشر کند');document.getElementById('playingTitle').textContent=m.title;document.getElementById('hint').textContent='کد '+t.code+' • شروع پخش از دقیقه '+Math.floor(elapsed/60);let v=document.getElementById('video');v.src=URL.createObjectURL(blob);document.getElementById('playerPage').classList.add('open');v.currentTime=elapsed;v.play().catch(()=>{})}function closePlayer(){let v=document.getElementById('video');v.pause();v.removeAttribute('src');v.load();document.getElementById('playerPage').classList.remove('open')}function wallet(){let s=state();open(`<button class="close" onclick="closeModal()">✕</button><h2>🪙 کیف پول</h2><div class="grid"><div class="stat"><small>CinemaCoin</small><br><b>${fmt(s.coins)}</b></div><div class="stat"><small>درآمد ناشر</small><br><b>${fmt(s.revenue)}</b></div></div><div class="notice">۱۰۰۰ سینماکوین اولیه است. با هر بلیت فروخته‌شده، ${fmt(REWARD)} واحد درآمد ثبت می‌شود. این موجودی و درآمد در همین مرورگر ذخیره می‌شوند.</div>`)}render();setInterval(render,15000);</script></body></html>
