<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سینمای دیجیتال</title><style>
:root{--r:#e50914;--r2:#ff2733;--gold:#ffd34d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#350408,#070707 45%,#030303);color:#fff;font-family:Tahoma,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:#050505ee;border-bottom:1px solid #421015}.nav{max-width:1200px;margin:auto;padding:14px 18px;display:flex;gap:10px;align-items:center}.logo{font-size:24px;font-weight:900}.logo b{color:var(--r)}.links{margin-right:auto;display:flex;gap:7px;flex-wrap:wrap}.links button,.coin{background:#120607;border:1px solid #401116;color:#fff;border-radius:11px;padding:9px 12px}.coin{color:var(--gold);font-weight:900}.hero,.section{max-width:1200px;margin:auto;padding:40px 18px}.hero h1{font-size:clamp(36px,6vw,68px);margin:0 0 12px}.hero h1 span{color:var(--r)}.hero p{color:#bbb;line-height:2;max-width:780px}.movies{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.movie{background:#111;border:1px solid #292929;border-radius:18px;overflow:hidden}.poster{height:280px;background-size:cover;background-position:center}.body{padding:15px}.body p{color:#aaa;line-height:1.9}.tags{color:#ccc;font-size:13px}.sessions{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.session,.btn{background:var(--r);color:#fff;border:0;border-radius:10px;padding:9px 12px;font-weight:900}.more{width:100%}.ticket{background:#101010;border:1px solid #292929;border-right:4px solid var(--r);padding:15px;border-radius:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:10px 0}.grow{flex:1}.code{color:var(--gold);font-weight:900}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:14px;z-index:50}.modal.open{display:flex}.box{width:min(820px,100%);max-height:92vh;overflow:auto;background:#0d0d0d;border:1px solid #67151c;border-radius:20px;padding:20px}.close{float:left;background:#292929;border:0;color:#fff;border-radius:9px;padding:7px 10px}.notice{background:#190608;border:1px solid #4b1116;padding:12px;border-radius:11px;line-height:1.9;margin:12px 0}.seats{display:grid;gap:7px;margin:18px 0}.seatrow{display:grid;grid-template-columns:35px repeat(6,1fr);gap:6px}.seat{height:38px;background:#191919;color:#fff;border:1px solid #444;border-radius:8px}.seat.sel{background:var(--r)}.seat.taken,.seat.reserved{background:#555;color:#999;text-decoration:line-through;cursor:not-allowed}.screen{height:10px;background:linear-gradient(90deg,transparent,var(--r),transparent);box-shadow:0 0 22px var(--r);border-radius:50%;margin:15px 0}.detailPoster{width:100%;height:300px;object-fit:cover;border-radius:15px}.empty{border:1px dashed #444;padding:25px;text-align:center;color:#999;border-radius:15px}.player{position:fixed;inset:0;background:#000;z-index:100;display:none}.player.open{display:flex;align-items:center;justify-content:center}.player video{width:100%;height:100%;object-fit:contain}.playerTop{position:absolute;top:0;right:0;left:0;z-index:2;padding:18px;background:linear-gradient(#000c,transparent);display:flex;justify-content:space-between}.playerTop button{background:#ffffff18;border:1px solid #ffffff33;color:#fff;border-radius:10px;padding:8px}.toast{position:fixed;bottom:20px;right:20px;background:#171717;border:1px solid #551219;padding:12px 16px;border-radius:11px;display:none;z-index:200}.auth{position:fixed;inset:0;background:#050505;z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}.authbox{width:min(430px,100%);background:#111;border:1px solid #551219;border-radius:20px;padding:25px}.auth input{width:100%;margin:7px 0;background:#181818;color:#fff;border:1px solid #444;border-radius:10px;padding:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.stat{background:#101010;border:1px solid #292929;border-radius:15px;padding:18px}.stat b{font-size:25px;color:var(--gold)}@media(max-width:700px){.nav{flex-wrap:wrap}.links{width:100%;order:3}.poster{height:230px}.seat{height:34px;font-size:11px}}
</style></head><body>
<header class="top"><nav class="nav"><div class="logo">سینمای <b>دیجیتال</b></div><div class="links"><button onclick="go('movies')">فیلم‌ها</button><button onclick="go('tickets')">بلیط‌های من</button><button onclick="wallet()">کیف پول</button><button onclick="location.href='income.html'">💰 درآمد / ناشر</button><button onclick="logout()">خروج</button></div><div class="coin">🪙 <span id="coins">1000</span> سینماکوین</div></nav></header>
<section class="hero"><h1>سینما، <span>همین‌جا.</span></h1><p>فیلم‌ها، سانس‌ها و صندلی‌ها برای همه کاربران مشترک هستند. بلیت را آنلاین بخر و در زمان سانس وارد پخش شو.</p><button class="btn" onclick="go('movies')">🎬 دیدن فیلم‌ها</button></section>
<section class="section" id="movies"><h2>🎬 فیلم‌های سینما</h2><div class="movies" id="movieList"></div></section><section class="section" id="tickets"><h2>🎟️ بلیط‌های من</h2><div id="ticketList"></div></section>
<div class="modal" id="modal"><div class="box" id="box"></div></div><div class="player" id="playerPage"><div class="playerTop"><b id="playingTitle"></b><button onclick="closePlayer()">✕ خروج</button></div><video id="video" controls playsinline></video></div><div class="toast" id="toast"></div>
<div class="auth" id="auth"><div class="authbox"><h2>🎬 ورود به سینمای دیجیتال</h2><p style="color:#aaa">برای ورود و ثبت‌نام، ایمیل واقعی و رمز عبور وارد کن.</p><input id="email" type="email" autocomplete="email" placeholder="ایمیل (مثلاً name@example.ir یا Gmail)"><input id="password" type="password" autocomplete="current-password" placeholder="رمز عبور (حداقل ۶ کاراکتر)"><input id="name" autocomplete="name" placeholder="نام و نام خانوادگی (فارسی هم مجاز است)"><button type="button" class="btn" id="signupBtn" onclick="signup()" style="width:100%;margin-top:8px">ثبت‌نام</button><button type="button" class="session" id="loginBtn" onclick="login()" style="width:100%;margin-top:7px">ورود</button><p id="authmsg" style="min-height:24px;color:#f77;line-height:1.7"></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>
const sb=supabase.createClient('https://qqwifsgnzweslkcyuqmg.supabase.co','sb_publishable_AI6rSMSOAag61TCJzapLbg_frex6ks9'),PRICE=250,$=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('fa-IR'),esc=x=>String(x??'').replace(/[&<>"']/g,function(a){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]});let user=null,selected=[],showId=null;
function go(id){$(id).scrollIntoView({behavior:'smooth'})}function toast(x){let e=$('toast');e.textContent=x;e.style.display='block';setTimeout(function(){e.style.display='none'},2800)}
function authMessage(x,ok=false){$('authmsg').textContent=x;$('authmsg').style.color=ok?'#7dff9b':'#ff7777'}
async function login(){try{let email=$('email').value.trim(),password=$('password').value;if(!email||!password)return authMessage('ایمیل و رمز عبور را وارد کن.');if(!email.includes('@'))return authMessage('ایمیل را کامل وارد کن؛ مثلاً name@example.ir');if(!window.supabase)return authMessage('اتصال به سرویس ورود برقرار نشد؛ صفحه را یک‌بار تازه‌سازی کن.');authMessage('در حال ورود...',true);let r=await sb.auth.signInWithPassword({email,password});if(r.error)return authMessage('ورود انجام نشد: '+r.error.message);user=r.data.user;$('auth').style.display='none';authMessage('');await render()}catch(e){authMessage('خطا در ورود: '+(e.message||e))}}
async function signup(){try{let email=$('email').value.trim(),password=$('password').value,name=$('name').value.trim();if(!email||!password)return authMessage('ایمیل و رمز عبور را وارد کن.');if(!email.includes('@'))return authMessage('ایمیل را کامل وارد کن؛ مثلاً name@example.ir');if(password.length<6)return authMessage('رمز عبور باید حداقل ۶ کاراکتر باشد.');if(!window.supabase)return authMessage('اتصال به سرویس ثبت‌نام برقرار نشد؛ صفحه را یک‌بار تازه‌سازی کن.');authMessage('در حال ثبت‌نام...',true);let r=await sb.auth.signUp({email,password,options:{data:{name}}});if(r.error)return authMessage('ثبت‌نام انجام نشد: '+r.error.message);if(r.data.session){user=r.data.user;$('auth').style.display='none';authMessage('',true);await render()}else authMessage('ثبت‌نام انجام شد. اگر پیام تأیید ایمیل آمد، ایمیل را تأیید کن و سپس وارد شو.',true)}catch(e){authMessage('خطا در ثبت‌نام: '+(e.message||e))}}
document.addEventListener('DOMContentLoaded',function(){$('signupBtn').addEventListener('click',signup);$('loginBtn').addEventListener('click',login);});
async function logout(){await sb.auth.signOut();location.reload()}
async function profile(){let r=await sb.from('profiles').select('*').eq('id',user.id).single();return r.data||{coins:1000,revenue:0}}
async function render(){if(!user)return;let p=await profile();$('coins').textContent=fmt(p.coins);let r=await sb.from('movies').select('*').eq('status','published').order('created_at',{ascending:false}),movies=r.data||[],ids=movies.map(function(m){return m.id}),sr=ids.length?await sb.from('showtimes').select('*').in('movie_id',ids).order('show_date').order('show_time'):({data:[]}),shows=sr.data||[];$('movieList').innerHTML=movies.length?movies.map(function(m){let poster=m.poster_path?sb.storage.from('posters').getPublicUrl(m.poster_path).data.publicUrl:'';let ss=shows.filter(function(x){return x.movie_id===m.id});return '<article class="movie"><div class="poster" style="background-image:url('+JSON.stringify(poster)+')"></div><div class="body"><h3>'+esc(m.title)+'</h3><div class="tags">'+esc(m.genre)+' • '+fmt(m.duration)+' دقیقه • ناشر: '+esc(m.publisher)+'</div><p>'+esc(m.description)+'</p><div class="sessions">'+ss.map(function(x){return '<button class="session" onclick="buy(\\''+x.id+'\\')">📅 '+x.show_date+' ⏰ '+String(x.show_time).slice(0,5)+'</button>'}).join('')+'</div></div></article>'}).join(''):'<div class="empty">هنوز فیلمی منتشر نشده.</div>';
let tr=await sb.from('tickets').select('*,ticket_seats(seat_no),movies(title),showtimes(show_date,show_time)').eq('user_id',user.id).order('purchased_at',{ascending:false}),ts=tr.data||[];$('ticketList').innerHTML=ts.length?ts.map(function(t){return '<div class="ticket"><div class="grow"><b>'+esc(t.movies?.title)+'</b><div style="color:#999">'+t.showtimes?.show_date+' • سانس '+String(t.showtimes?.show_time||'').slice(0,5)+' • صندلی '+(t.ticket_seats||[]).map(function(s){return s.seat_no}).join('، ')+'</div></div><div class="code">'+esc(t.code)+'</div><button class="btn" onclick="enter(\\''+t.id+'\\')">🎬 ورود به فیلم</button></div>'}).join(''):'<div class="empty">هنوز بلیتی نداری.</div>'}
function open(x){$('box').innerHTML=x;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}
async function buy(id){selected=[];showId=id;let a=await sb.from('showtimes').select('*,movies(*)').eq('id',id).single();if(a.error)return toast(a.error.message);let b=await sb.from('ticket_seats').select('seat_no').eq('showtime_id',id),used=new Set((b.data||[]).map(function(x){return x.seat_no})),m=a.data.movies,h='<button class="close" onclick="closeModal()">✕</button><h2>انتخاب صندلی • '+esc(m.title)+'</h2><div class="notice">سانس: '+a.data.show_date+' • '+String(a.data.show_time).slice(0,5)+' • هر صندلی '+fmt(PRICE)+' CinemaCoin</div><div class="screen"></div><div style="text-align:center;color:#888">صفحه نمایش</div><div class="seats">';for(let n=1;n<=66;n++){let r=Math.ceil(n/6),c=(n-1)%6+1;if(c===1)h+='<div class="seatrow"><div style="color:#777;text-align:center">'+r+'</div>';h+='<button class="seat '+(used.has(n)?'taken ':'')+(n>60?'reserved':'')+'" '+(used.has(n)||n>60?'disabled':'')+' onclick="toggleSeat(this,'+n+')">'+c+'</button>';if(c===6)h+='</div>'}h+='</div><div class="notice">۶۰ صندلی قابل فروش؛ ۶ جایگاه آخر رزرو سالن.<br><span id="selectedInfo">هنوز صندلی انتخاب نشده</span></div><button class="btn" onclick="confirmBuy()">پرداخت و صدور بلیت</button>';open(h)}
function toggleSeat(el,n){if(el.disabled)return;if(el.classList.contains('sel')){el.classList.remove('sel');selected=selected.filter(function(x){return x!==n})}else{if(selected.length>=6)return toast('حداکثر ۶ صندلی');el.classList.add('sel');selected.push(n)}$('selectedInfo').textContent=selected.length?'صندلی‌ها: '+selected.join('، ')+' • هزینه: '+fmt(selected.length*PRICE):'هنوز صندلی انتخاب نشده'}
async function confirmBuy(){if(!selected.length)return toast('حداقل یک صندلی انتخاب کن');let r=await sb.rpc('purchase_ticket',{p_showtime:showId,p_seats:selected});if(r.error)return toast(r.error.message.includes('SEAT_TAKEN')?'یکی از صندلی‌ها قبلاً گرفته شده':'خرید انجام نشد: '+r.error.message);let code=r.data.code;selected=[];closeModal();toast('بلیت صادر شد: '+code);render();go('tickets')}
async function enter(id){let r=await sb.from('tickets').select('*,movies(*),showtimes(show_date,show_time)').eq('id',id).single();if(r.error||!r.data)return toast('بلیت پیدا نشد');let t=r.data,start=new Date(t.showtimes.show_date+'T'+String(t.showtimes.show_time).slice(0,8)).getTime(),elapsed=(Date.now()-start)/1000;if(elapsed<0)return toast('سانس هنوز شروع نشده');if(elapsed>=t.movies.duration*60)return toast('این سانس تمام شده');let v=await sb.storage.from('movies').createSignedUrl(t.movies.video_path,3600);if(v.error)return toast('دسترسی ویدیو برقرار نشد');$('playingTitle').textContent=t.movies.title;$('video').src=v.data.signedUrl;$('playerPage').classList.add('open');$('video').currentTime=elapsed;$('video').play().catch(function(){})}
function closePlayer(){$('video').pause();$('video').removeAttribute('src');$('video').load();$('playerPage').classList.remove('open')}
async function wallet(){let p=await profile();open('<button class="close" onclick="closeModal()">✕</button><h2>🪙 کیف پول</h2><div class="grid"><div class="stat"><small>CinemaCoin</small><br><b>'+fmt(p.coins)+'</b></div><div class="stat"><small>درآمد ناشر</small><br><b>'+fmt(p.revenue)+'</b></div></div><div class="notice">موجودی اولیه هر حساب ۱۰۰۰ CinemaCoin است. به ازای هر صندلی فروخته‌شده ۱۰۰ واحد درآمد برای صاحب فیلم ثبت می‌شود. هر ۱۰۰ واحد درآمد = ۱ CinemaCoin.</div>')}
sb.auth.onAuthStateChange(function(_e,s){if(s){user=s.user;$('auth').style.display='none';render()}else $('auth').style.display='flex'});sb.auth.getSession().then(function(r){if(r.data.session){user=r.data.session.user;$('auth').style.display='none';render()}});
</script></body></html>
