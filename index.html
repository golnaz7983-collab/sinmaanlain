<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سینمای دیجیتال</title><style>
:root{--r:#e50914;--r2:#ff2733;--bg:#050505;--p:#111;--p2:#181818;--mut:#aaa;--gold:#ffd34d;--green:#36d477}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#350408,#070707 45%,#030303);color:#fff;font-family:Tahoma,Arial,sans-serif}button{font:inherit;cursor:pointer}.top{position:sticky;top:0;z-index:20;background:#050505ee;border-bottom:1px solid #421015;backdrop-filter:blur(10px)}.nav{max-width:1200px;margin:auto;padding:14px 18px;display:flex;gap:12px;align-items:center}.logo{font-size:24px;font-weight:900}.logo b{color:var(--r)}.links{margin-right:auto;display:flex;gap:7px}.links button,.coin{background:#120607;border:1px solid #401116;color:#fff;border-radius:11px;padding:9px 12px}.coin{color:var(--gold);font-weight:900}.hero{max-width:1200px;margin:auto;padding:50px 18px 30px}.hero h1{font-size:clamp(36px,6vw,68px);margin:0 0 12px}.hero h1 span{color:var(--r)}.hero p{color:#bbb;line-height:2;font-size:17px;max-width:750px}.section{max-width:1200px;margin:auto;padding:20px 18px 45px}.section h2{font-size:28px}.movies{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.movie{background:linear-gradient(#171717,#0d0d0d);border:1px solid #292929;border-radius:18px;overflow:hidden;transition:.2s}.movie:hover{transform:translateY(-4px);border-color:#7b121a}.poster{height:250px;background-size:cover;background-position:center;position:relative}.poster:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,#000)}.posterText{position:absolute;z-index:1;bottom:15px;right:15px;left:15px}.posterText h3{font-size:23px;margin:0}.body{padding:15px}.body p{color:#aaa;line-height:1.8;min-height:55px}.tags{color:#ccc;font-size:13px}.sessions{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.session{background:#190608;color:#fff;border:1px solid #59141a;border-radius:9px;padding:8px 11px}.session.live{border-color:var(--green);color:var(--green)}.more{width:100%;background:#242424;color:#fff;border:0;border-radius:10px;padding:11px;font-weight:800}.ticket{background:#101010;border:1px solid #292929;border-right:4px solid var(--r);padding:15px;border-radius:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:10px 0}.grow{flex:1}.code{color:var(--gold);font-weight:900}.btn{background:var(--r);color:#fff;border:0;border-radius:11px;padding:11px 15px;font-weight:900}.btn:hover{background:var(--r2)}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:14px;z-index:50}.modal.open{display:flex}.box{width:min(760px,100%);max-height:92vh;overflow:auto;background:#0d0d0d;border:1px solid #67151c;border-radius:20px;padding:20px}.close{float:left;background:#292929;border:0;color:#fff;border-radius:9px;padding:7px 10px}.notice{background:#190608;border:1px solid #4b1116;padding:12px;border-radius:11px;line-height:1.9;margin:12px 0}.seats{display:grid;gap:7px;margin:18px 0}.seatrow{display:grid;grid-template-columns:35px repeat(6,1fr);gap:6px}.seat{height:38px;background:#191919;color:#fff;border:1px solid #444;border-radius:8px}.seat.sel{background:var(--r);border-color:var(--r2)}.seat.taken,.seat.reserved{background:#555;color:#999;text-decoration:line-through;cursor:not-allowed}.reserved{background:#241515!important;color:#704b4b!important}.screen{height:10px;background:linear-gradient(90deg,transparent,var(--r),transparent);box-shadow:0 0 22px var(--r);border-radius:50%;margin:15px 0}.detailPoster{width:100%;height:280px;object-fit:cover;border-radius:15px}.empty{border:1px dashed #444;padding:25px;text-align:center;color:#999;border-radius:15px}.player{position:fixed;inset:0;background:#000;z-index:100;display:none}.player.open{display:flex;align-items:center;justify-content:center}.player video{width:100%;height:100%;object-fit:contain}.playerTop{position:absolute;top:0;right:0;left:0;z-index:2;padding:18px;background:linear-gradient(#000c,transparent);display:flex;justify-content:space-between}.playerTop button{background:#ffffff18;border:1px solid #ffffff33;color:#fff;border-radius:10px;padding:8px}.hint{position:absolute;bottom:65px;right:18px;background:#000b;padding:9px 13px;border-radius:10px}.toast{position:fixed;bottom:20px;right:20px;background:#171717;border:1px solid #551219;padding:12px 16px;border-radius:11px;display:none;z-index:200}@media(max-width:700px){.links{position:absolute;top:65px;right:12px;left:12px}.nav{padding-bottom:58px}.poster{height:220px}.seat{height:34px;font-size:11px}}
</style></head><body>
<header class="top"><nav class="nav"><div class="logo">سینمای <b>دیجیتال</b></div><div class="links"><button onclick="go('movies')">فیلم‌ها</button><button onclick="go('tickets')">بلیط‌های من</button><button onclick="wallet()">کیف پول</button></div><div class="coin">🪙 <span id="coins">1000</span> سینماکوین</div></nav></header>
<section class="hero"><h1>سینما، <span>همین‌جا.</span></h1><p>فیلم را انتخاب کن، وارد صفحه اختصاصی آن شو، سانس آنلاین را ببین، صندلی انتخاب کن و بلیت دیجیتال بگیر. این نسخه برای تست آماده شده و سانس فیلم آزمایشی تا ۲۴ ساعت آینده فعال است.</p><button class="btn" onclick="go('movies')">🎬 شروع تست</button></section>
<section class="section" id="movies"><h2>🎬 فیلم‌ها</h2><div class="movies" id="movieList"></div></section>
<section class="section" id="tickets"><h2>🎟️ بلیط‌های من</h2><div id="ticketList"></div></section>
<div class="modal" id="modal"><div class="box" id="box"></div></div>
<div class="player" id="playerPage"><div class="playerTop"><b id="playingTitle"></b><button onclick="closePlayer()">✕ خروج</button></div><video id="video" controls playsinline></video><div class="hint" id="hint"></div></div><div class="toast" id="toast"></div>
<script>
const VIDEO='https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',KEY='cinema_test_v2',PRICE=250;
const MOVIES=[{id:'test',title:'فیلم آزمایشی سینما',genre:'ماجراجویی • تست آنلاین',desc:'این فیلم موقتاً برای تست خرید بلیت، انتخاب صندلی، کد بلیت، سانس و ورود به پخش قرار داده شده است.',poster:'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1000&q=85',duration:596,temporary:true}];
function state(){try{return JSON.parse(localStorage.getItem(KEY))||{coins:1000,tickets:[],taken:{}}}catch(e){return{coins:1000,tickets:[],taken:{}}}}
function save(s){localStorage.setItem(KEY,JSON.stringify(s));render()};function go(id){document.getElementById(id).scrollIntoView({behavior:'smooth'})};function toast(x){let e=document.getElementById('toast');e.textContent=x;e.style.display='block';setTimeout(()=>e.style.display='none',2500)};function fmt(n){return Number(n).toLocaleString('fa-IR')}
function start24(){let k='cinema_test_start';let x=localStorage.getItem(k);if(!x){x=Date.now();localStorage.setItem(k,x)}return +x}const TEST_START=start24();
function sessionInfo(){let end=TEST_START+86400000,now=Date.now();if(now<TEST_START)return{status:'آماده',text:'سانس به‌زودی'};if(now<end)return{status:'online',text:'سانس آنلاین'};return{status:'ended',text:'سانس تمام شده'}}
function render(){let s=state();document.getElementById('coins').textContent=fmt(s.coins);let info=sessionInfo();document.getElementById('movieList').innerHTML=MOVIES.map(m=>`<article class="movie"><div class="poster" style="background-image:url('${m.poster}')"><div class="posterText"><h3>${m.title}</h3><small>${m.temporary?'🧪 فیلم آزمایشی • حذف در بروزرسانی بعدی':''}</small></div></div><div class="body"><div class="tags">${m.genre} • مدت تقریبی ${Math.round(m.duration/60)} دقیقه</div><p>${m.desc}</p><div class="sessions"><button class="session ${info.status==='online'?'live':''}" onclick="details('${m.id}')">${info.text} • همین الان</button></div><button class="more" onclick="details('${m.id}')">مشاهده صفحه فیلم و خرید بلیت ←</button></div></article>`).join('');let ts=s.tickets.slice().reverse();document.getElementById('ticketList').innerHTML=ts.length?ts.map(t=>`<div class="ticket"><div class="grow"><b>${t.title}</b><div style="color:#999;margin-top:5px">سانس آزمایشی • صندلی ${t.seats.join('، ')}</div></div><div><div class="code">${t.code}</div><small style="color:#777">کد بلیت</small></div><button class="btn" onclick="enter('${t.code}')">🎬 تماشا با بلیت</button></div>`).join(''):'<div class="empty">هنوز بلیتی نداری؛ فیلم آزمایشی را باز کن و تست را شروع کن.</div>'}
function details(id){let m=MOVIES.find(x=>x.id===id),info=sessionInfo();open(`<button class="close" onclick="closeModal()">✕</button><h2>${m.title}</h2><img class="detailPoster" src="${m.poster}"><p style="color:#bbb;line-height:2">${m.desc}</p><div class="notice"><b>🟢 وضعیت سانس:</b> ${info.text}<br>این سانس از زمان ساخت تست تا <b>۲۴ ساعت</b> فعال است.</div><p>قیمت هر صندلی: <b style="color:var(--gold)">${PRICE} سینماکوین</b></p><button class="btn" onclick="buy('${m.id}')">🎟️ خرید بلیت و انتخاب صندلی</button>`)}
function wallet(){let s=state();open(`<button class="close" onclick="closeModal()">✕</button><h2>🪙 کیف پول</h2><div class="notice">موجودی: <b style="color:var(--gold)">${fmt(s.coins)} سینماکوین</b></div><p style="color:#aaa">برای تست، موجودی اولیه ۱۰۰۰ سینماکوین است.</p>`)}
function open(x){document.getElementById('box').innerHTML=x;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}
function buy(id){let m=MOVIES.find(x=>x.id===id),s=state(),taken=s.taken[id]||[];let html='<button class="close" onclick="closeModal()">✕</button><h2>انتخاب صندلی • '+m.title+'</h2><div class="screen"></div><div style="text-align:center;color:#888">صفحه نمایش</div><div class="seats">';for(let r=1;r<=11;r++){html+=`<div class="seatrow"><div style="color:#777;text-align:center">${r}</div>`;for(let c=1;c<=6;c++){let n=`${r}-${c}`,reserved=(r===11),tk=taken.includes(n);html+=`<button class="seat ${tk?'taken':''} ${reserved?'reserved':''}" ${tk||reserved?'disabled':''} onclick="toggleSeat(this,'${n}')">${c}</button>`}html+='</div>'}html+='</div><div style="color:#999">۶۰ صندلی قابل فروش • ردیف ۱۱ برای جایگاه/رزرو سالن نگه داشته شده</div><div id="selectedInfo" class="notice">هنوز صندلی انتخاب نشده</div><button class="btn" onclick="confirmBuy(\''+id+'\')">پرداخت با سینماکوین و صدور بلیت</button>';open(html)}
let selected=[];function toggleSeat(el,n){if(el.disabled)return;if(el.classList.contains('sel')){el.classList.remove('sel');selected=selected.filter(x=>x!==n)}else{if(selected.length>=6){toast('حداکثر ۶ صندلی در هر خرید');return}el.classList.add('sel');selected.push(n)}document.getElementById('selectedInfo').textContent=selected.length?`صندلی‌ها: ${selected.join('، ')} • هزینه: ${fmt(selected.length*PRICE)} سینماکوین`:'هنوز صندلی انتخاب نشده'}
function confirmBuy(id){let s=state(),m=MOVIES.find(x=>x.id===id);if(!selected.length)return toast('حداقل یک صندلی انتخاب کن');let cost=selected.length*PRICE;if(s.coins<cost)return toast('سینماکوین کافی نیست');let taken=s.taken[id]||[];if(selected.some(x=>taken.includes(x)))return toast('یکی از صندلی‌ها همین الان گرفته شده');let code='CIN-'+Math.random().toString(36).slice(2,8).toUpperCase();s.coins-=cost;s.tickets.push({code,title:m.title,movie:id,seats:[...selected],start:TEST_START,duration:m.duration,boughtAt:Date.now()});s.taken[id]=taken.concat(selected);selected=[];save(s);closeModal();toast('بلیت صادر شد: '+code);go('tickets')}
function enter(code){let s=state(),t=s.tickets.find(x=>x.code===code);if(!t)return;let now=Date.now(),elapsed=(now-t.start)/1000;if(now<t.start)return toast('سانس هنوز شروع نشده');if(elapsed>=t.duration)return toast('این سانس تمام شده');document.getElementById('playingTitle').textContent=t.title;document.getElementById('hint').textContent='ورود با بلیت '+t.code+' • شروع پخش از دقیقه '+Math.floor(elapsed/60);let v=document.getElementById('video');v.src=VIDEO;document.getElementById('playerPage').classList.add('open');v.currentTime=Math.max(0,elapsed);v.play().catch(()=>{})}
function closePlayer(){let v=document.getElementById('video');v.pause();v.removeAttribute('src');v.load();document.getElementById('playerPage').classList.remove('open')}
render();setInterval(render,30000);
</script></body></html>
