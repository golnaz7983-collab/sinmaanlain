<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>درآمد و انتشار فیلم</title><style>
:root{--r:#e50914;--gold:#ffd34d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#350408,#050505 48%);color:#fff;font-family:Tahoma,Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:22px}.top{display:flex;gap:10px;align-items:center;border-bottom:1px solid #381015;padding-bottom:16px}.top h1{margin:0}.back,.btn{background:var(--r);color:#fff;border:0;border-radius:11px;padding:11px 15px;font-weight:900;text-decoration:none;cursor:pointer}.back{margin-right:auto;background:#191919}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:20px 0}.card,form,.movie{background:#101010;border:1px solid #292929;border-radius:15px;padding:18px}.card b{font-size:27px;color:var(--gold)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:13px}.field label{display:block;color:#bbb;margin-bottom:7px}.field input,.field textarea{width:100%;background:#171717;color:#fff;border:1px solid #444;border-radius:10px;padding:11px}.field textarea{min-height:100px}.hint{color:#999;line-height:1.9}.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.days label{background:#171717;border:1px solid #444;border-radius:10px;padding:10px}.movie{display:flex;gap:15px;align-items:center;margin:9px 0}.poster{width:90px;height:120px;object-fit:cover;border-radius:10px}.grow{flex:1}.auth{position:fixed;inset:0;background:#050505;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}.authbox{width:min(430px,100%);background:#111;border:1px solid #551219;border-radius:20px;padding:25px}.auth input{width:100%;margin:7px 0;background:#181818;color:#fff;border:1px solid #444;border-radius:10px;padding:12px}@media(max-width:650px){.row{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="top"><h1>💰 درآمد و انتشار فیلم</h1><a class="back" href="index.html">← بازگشت</a></div><div id="app"><div class="grid"><div class="card">درآمد<br><b id="revenue">0</b></div><div class="card">CinemaCoin<br><b id="coins">1000</b></div><div class="card">فروش صندلی<br><b id="sales">0</b></div></div><div class="card"><input id="amount" type="number" min="100" step="100" value="1000" style="padding:10px;background:#171717;color:#fff;border:1px solid #444;border-radius:9px"><button class="btn" onclick="convert()">تبدیل درآمد به CinemaCoin</button></div>
<form id="form"><h2>🎬 انتشار فیلم برای همه</h2><div class="row"><div class="field"><label>نام فیلم</label><input id="title" required></div><div class="field"><label>نام ناشر</label><input id="publisher" required></div></div><div class="row"><div class="field"><label>ژانر</label><input id="genre" required></div><div class="field"><label>مدت (دقیقه)</label><input id="duration" type="number" min="1" value="90" required></div></div><div class="row"><div class="field"><label>تاریخ انتشار</label><input id="release" type="date" required></div><div class="field"><label>پوستر</label><input id="poster" type="file" accept="image/*" required></div></div><div class="field"><label>توضیحات</label><textarea id="desc" required></textarea></div><div class="field"><label>فایل کامل فیلم</label><input id="video" type="file" accept="video/*" required><div class="hint">فایل در Storage مشترک سینما ذخیره می‌شود.</div></div><div class="field"><label>۳ سانس</label><div class="row"><input class="time" type="time" required><input class="time" type="time" required><input class="time" type="time" required></div></div><div class="field"><label>روزهای نمایش</label><div class="days" id="days"></div></div><button class="btn" type="submit">🚀 انتشار عمومی</button></form><section><h2>🎞️ فیلم‌های من</h2><div id="movies"></div></section></div></main>
<div class="auth" id="auth"><div class="authbox"><h2>ورود ناشر</h2><input id="email" type="email" placeholder="ایمیل"><input id="password" type="password" placeholder="رمز عبور"><input id="name" placeholder="نام در ثبت‌نام"><button class="btn" style="width:100%;margin-top:8px" onclick="signup()">ثبت‌نام</button><button class="back" style="width:100%;margin-top:8px" onclick="login()">ورود</button><p id="msg" style="color:#f77"></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient('https://qqwifsgnzweslkcyuqmg.supabase.co','sb_publishable_AI6rSMSOAag61TCJzapLbg_frex6ks9'),$=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('fa-IR');let user=null;
async function login(){let r=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)$('msg').textContent=r.error.message}
async function signup(){let r=await sb.auth.signUp({email:$('email').value,password:$('password').value,options:{data:{name:$('name').value}}});if(r.error)$('msg').textContent=r.error.message;else if(r.data.session){user=r.data.user;$('auth').style.display='none';render()}else $('msg').textContent='ثبت‌نام شد؛ ایمیل را تأیید کن.'}
async function profile(){let r=await sb.from('profiles').select('*').eq('id',user.id).single();return r.data}
async function render(){let p=await profile();$('revenue').textContent=fmt(p?.revenue);$('coins').textContent=fmt(p?.coins);let r=await sb.from('movies').select('*').eq('owner_id',user.id).order('created_at',{ascending:false}),ms=r.data||[],ids=ms.map(function(m){return m.id}),sh=ids.length?(await sb.from('showtimes').select('*').in('movie_id',ids)).data||[]:[],tr=ids.length?(await sb.from('tickets').select('movie_id,ticket_seats(seat_no)').in('movie_id',ids)).data||[]:[];$('sales').textContent=fmt(tr.reduce(function(a,t){return a+(t.ticket_seats?.length||0)},0));$('movies').innerHTML=ms.map(function(m){let poster=m.poster_path?sb.storage.from('posters').getPublicUrl(m.poster_path).data.publicUrl:'';return '<div class="movie"><img class="poster" src="'+poster+'"><div class="grow"><h3>'+m.title+'</h3><div class="hint">سانس‌ها: '+sh.filter(function(x){return x.movie_id===m.id}).map(function(x){return x.show_date+' '+String(x.show_time).slice(0,5)}).join(' • ')+'</div></div></div>'}).join('')||'<p class="hint">هنوز فیلمی نداری.</p>'}
async function convert(){let n=Math.floor(Number($('amount').value||0)),r=await sb.rpc('convert_revenue',{p_amount:n});if(r.error)return alert(r.error.message);alert('تبدیل انجام شد');render()}
function daysUI(){let now=new Date();for(let i=0;i<14;i++){let d=new Date(now);d.setDate(now.getDate()+i);let v=d.toISOString().slice(0,10),l=document.createElement('label');l.innerHTML='<input type="checkbox" value="'+v+'"> '+v;$('days').appendChild(l)}} 
$('form').addEventListener('submit',async function(e){e.preventDefault();let pf=$('poster').files[0],vf=$('video').files[0],days=[...document.querySelectorAll('#days input:checked')].map(function(x){return x.value}),times=[...document.querySelectorAll('.time')].map(function(x){return x.value});if(!days.length)return alert('حداقل یک روز');let id=crypto.randomUUID(),posterPath=user.id+'/'+id+'-'+pf.name.replace(/[^a-zA-Z0-9._-]/g,'_'),videoPath=user.id+'/'+id+'-'+vf.name.replace(/[^a-zA-Z0-9._-]/g,'_'),a=await sb.storage.from('posters').upload(posterPath,pf),b;if(a.error)return alert(a.error.message);b=await sb.storage.from('movies').upload(videoPath,vf);if(b.error){await sb.storage.from('posters').remove([posterPath]);return alert(b.error.message)}let m=await sb.from('movies').insert({id:id,owner_id:user.id,title:$('title').value.trim(),publisher:$('publisher').value.trim(),genre:$('genre').value.trim(),duration:Number($('duration').value),release_date:$('release').value,description:$('desc').value.trim(),poster_path:posterPath,video_path:videoPath,status:'published'}).select().single();if(m.error)return alert(m.error.message);let rows=[];days.forEach(function(d){times.forEach(function(t){rows.push({movie_id:id,show_date:d,show_time:t+':00'})})});let z=await sb.from('showtimes').insert(rows);if(z.error)return alert(z.error.message);alert('فیلم برای همه منتشر شد 🎬');e.target.reset();render()});
sb.auth.onAuthStateChange(function(_e,s){if(s){user=s.user;$('auth').style.display='none';render()}else $('auth').style.display='flex'});sb.auth.getSession().then(function(r){if(r.data.session){user=r.data.session.user;$('auth').style.display='none';render()}});daysUI();
</script></body></html>
